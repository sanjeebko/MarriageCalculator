version: "3.8"

services:
  marriagecalculator-api:
    build:
      context: ./MarriageCalculator
      dockerfile: MarriageCalculator.API/Dockerfile
    container_name: marriagecalculator-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - MCDATABASE=${DOCKER_MCDATABASE:-192.168.0.229:27017}
      - MCUSER=${DOCKER_MCUSER:-mcuserdev}
      - MCPASSWORD=${DOCKER_MCPASSWORD:-Scorpions18}
      - MCDATABASENAME=${DOCKER_MCDATABASENAME:-marriagecalculator_dev}
    volumes:
      - ./MarriageCalculator/MarriageCalculator.API/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: marriagecalculator-network
    driver: bridge
