version: "3.8"

# Dev environment: API only (uses external MongoDB at 192.168.0.229:27017)
# Usage: docker-compose -f docker-compose.dev.yml up --build
services:
  marriagecalculator-api:
    build:
      context: ..
      dockerfile: MarriageCalculator.API/Dockerfile
    container_name: mc-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MCDATABASE=192.168.0.229:27017
      - MCUSER=mcuserdev
      - MCPASSWORD=Scorpions18
      - MCDATABASENAME=marriagecalculator_dev
    networks:
      - mc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mc-network:
    driver: bridge
