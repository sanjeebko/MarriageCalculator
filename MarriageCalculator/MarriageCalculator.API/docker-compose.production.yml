version: '3.8'

services:
  marriagecalculator-api:
    build:
      context: ..
      dockerfile: MarriageCalculator.API/Dockerfile
    container_name: marriagecalculator-api
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - MCDATABASE=${MCDATABASE}
      - MCUSER=${MCUSER}
      - MCPASSWORD=${MCPASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/database/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - marriagecalculator-network

networks:
  marriagecalculator-network:
    driver: bridge