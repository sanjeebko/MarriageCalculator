version: '3.8'

services:
  marriagecalculator-api:
    build:
      context: ..
      dockerfile: MarriageCalculator.API/Dockerfile
    container_name: marriagecalculator-api
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - MCDATABASE=${MCDATABASE}
      - MCUSER=${MCUSER}
      - MCPASSWORD=${MCPASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD:-your_cert_password}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ~/.aspnet/https:/https:ro
    networks:
      - marriagecalculator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/database/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  marriagecalculator-network:
    driver: bridge